services:
  stor24-cms:
    build: .
    container_name: stor24-cms
    restart: unless-stopped
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URI=${DATABASE_URI}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
    volumes:
      - stor24_media:/app/media
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stor24-cms.rule=Host(`cms.stor24.co.za`)"
      - "traefik.http.routers.stor24-cms.entrypoints=websecure"
      - "traefik.http.routers.stor24-cms.tls=true"
      - "traefik.http.routers.stor24-cms.tls.certresolver=${STOR24_CERT_RESOLVER:-mytlschallenge}"
      # Default RemoteAddr checks the Cloudflare socket peer, not X-Forwarded-For.
      - "traefik.http.middlewares.stor24-cms-origin.ipallowlist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - "traefik.http.routers.stor24-cms.middlewares=stor24-cms-origin"
      - "traefik.http.services.stor24-cms.loadbalancer.server.port=3000"
      - "traefik.http.routers.stor24-cms-legacy.rule=Host(`cms.stor4.srv938083.hstgr.cloud`)"
      - "traefik.http.routers.stor24-cms-legacy.entrypoints=websecure"
      - "traefik.http.routers.stor24-cms-legacy.tls=true"
      - "traefik.http.routers.stor24-cms-legacy.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.stor24-cms-legacy.service=stor24-cms"
      - "traefik.http.routers.stor24-cms-legacy.middlewares=stor24-cms-origin"
      - "traefik.http.routers.stor24-cms-navigation.rule=Host(`cms.stor4.srv938083.hstgr.cloud`) && (Method(`GET`) || Method(`HEAD`))"
      - "traefik.http.routers.stor24-cms-navigation.priority=100"
      - "traefik.http.routers.stor24-cms-navigation.entrypoints=websecure"
      - "traefik.http.routers.stor24-cms-navigation.tls=true"
      - "traefik.http.routers.stor24-cms-navigation.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.stor24-cms-navigation.service=stor24-cms"
      - "traefik.http.routers.stor24-cms-navigation.middlewares=stor24-cms-canonical"
      - "traefik.http.middlewares.stor24-cms-canonical.redirectregex.regex=^https://cms[.]stor4[.]srv938083[.]hstgr[.]cloud/(.*)"
      - "traefik.http.middlewares.stor24-cms-canonical.redirectregex.replacement=https://cms.stor24.co.za/$${1}"
      - "traefik.http.middlewares.stor24-cms-canonical.redirectregex.permanent=true"
      - "traefik.docker.network=root_default"
networks:
  root_default:
    external: true
volumes:
  stor24_media:
