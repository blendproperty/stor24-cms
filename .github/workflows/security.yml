name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-rls-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: node scripts/test-synthetic-rls-backup.mjs
  isolated-database-role-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Create disposable non-superuser roles and database
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          psql -h localhost -U ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE synthetic_migrator LOGIN PASSWORD 'synthetic-migrator-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" -c "CREATE ROLE synthetic_runtime LOGIN PASSWORD 'synthetic-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" -c "CREATE DATABASE rls_probe_ci OWNER synthetic_migrator"
          psql -h localhost -U ci -d rls_probe_ci -v ON_ERROR_STOP=1 -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC" -c "GRANT USAGE ON SCHEMA public TO synthetic_runtime"
      - name: Verify role isolation and RLS trust boundary
        run: node --test tests/integration/database-role-rls.test.mjs tests/migration-connection.test.mjs
        env:
          DB_ROLE_TEST: isolated-ci
          DATABASE_URI: postgresql://synthetic_runtime:synthetic-runtime-only@localhost:5432/rls_probe_ci
          MIGRATION_DATABASE_URL: postgresql://synthetic_migrator:synthetic-migrator-only@localhost:5432/rls_probe_ci
  host-release-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/test-host-cms-release.py
      - run: bash -n scripts/host-cms-release.sh scripts/install-host-cms-release.sh
      - run: docker build -f tests/host-release/Dockerfile -t stor24-cms-host-boundary:test .
      - run: docker run --rm --network none stor24-cms-host-boundary:test
  node24-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build production image and verify Node version
        run: |
          docker build -t stor24-node24-cms:test .
          test "$(docker run --rm --entrypoint node stor24-node24-cms:test --version)" = v24.22.1
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: synthetic-ci
          POSTGRES_DB: stor24_cms_ci
        ports: [5432:5432, 55481:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/migration-connection.test.mjs tests/baseline-guard.test.mjs
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          PAYLOAD_SECRET: synthetic-ci-build-secret-never-used-in-production
          DATABASE_URI: postgresql://build:build@127.0.0.1:1/build
      - run: npm run test:security:integration -- --bootstrap
        env:
          CMS_SECURITY_DB_TEST: isolated-ci
          PAYLOAD_SECRET: synthetic-ci-security-secret-at-least-32-characters
          DATABASE_URI: postgresql://ci:synthetic-ci@localhost:5432/stor24_cms_ci
      - name: Prepare reconstructed-baseline staging roles
        env:
          PGPASSWORD: synthetic-ci
        run: |
          psql -h localhost -U ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE stage_owner LOGIN PASSWORD 'synthetic-owner-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" -c "CREATE ROLE stage_runtime LOGIN PASSWORD 'synthetic-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" -c "CREATE ROLE stage_tenant_a LOGIN PASSWORD 'synthetic-tenant-a' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" -c "CREATE ROLE stage_tenant_b LOGIN PASSWORD 'synthetic-tenant-b' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" -c "CREATE DATABASE cms_baseline_replay_ci OWNER stage_owner"
      - name: Apply and replay reconstructed CMS staging baseline
        env:
          CMS_BASELINE_TEST: isolated-ci
          NODE_ENV: production
          PAYLOAD_SECRET: synthetic-ci-security-secret-at-least-32-characters
          DATABASE_URI: postgresql://stage_runtime:synthetic-runtime-only@localhost:55481/cms_baseline_replay_ci
          MIGRATION_DATABASE_URL: postgresql://stage_owner:synthetic-owner-only@localhost:55481/cms_baseline_replay_ci
        run: |
          node scripts/bootstrap-reconstructed-baseline.mjs
          if node scripts/bootstrap-reconstructed-baseline.mjs; then echo 'Repeated bootstrap must fail'; exit 1; fi
          node scripts/migrate-with-owner.mjs
      - name: Grant restricted runtime privileges in disposable staging only
        env:
          PGPASSWORD: synthetic-ci
        run: |
          psql -h localhost -U ci -d cms_baseline_replay_ci -v ON_ERROR_STOP=1 -c 'REVOKE CREATE ON SCHEMA public FROM PUBLIC' -c 'GRANT USAGE ON SCHEMA public TO stage_runtime' -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO stage_runtime' -c 'GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO stage_runtime' -c 'REVOKE ALL ON TABLE payload_migrations FROM stage_runtime'
      - name: Exercise reconstructed baseline with restricted runtime
        env:
          CMS_SECURITY_DB_TEST: isolated-ci
          PAYLOAD_SECRET: synthetic-ci-security-secret-at-least-32-characters
          DATABASE_URI: postgresql://stage_runtime:synthetic-runtime-only@localhost:55481/cms_baseline_replay_ci
        run: npm run test:security:integration
      - name: Exercise role-bound policies on CMS posts in disposable staging
        env:
          DB_ROLE_TEST: isolated-ci
          DATABASE_URI: postgresql://stage_runtime:synthetic-runtime-only@localhost:55481/cms_baseline_replay_ci
          MIGRATION_DATABASE_URL: postgresql://stage_owner:synthetic-owner-only@localhost:55481/cms_baseline_replay_ci
          PUBLIC_ROLE_URL: postgresql://stage_tenant_a:synthetic-tenant-a@localhost:55481/cms_baseline_replay_ci
          EDITOR_ROLE_URL: postgresql://stage_tenant_b:synthetic-tenant-b@localhost:55481/cms_baseline_replay_ci
        run: node --test tests/integration/posts-rls-stage.test.mjs
      - name: Exercise CMS HTTP access with separate database identities and RLS
        env:
          DB_ROLE_TEST: isolated-ci
          PAYLOAD_SECRET: synthetic-ci-security-secret-at-least-32-characters
          DATABASE_URI: postgresql://stage_runtime:synthetic-runtime-only@localhost:55481/cms_baseline_replay_ci
          MIGRATION_DATABASE_URL: postgresql://stage_owner:synthetic-owner-only@localhost:55481/cms_baseline_replay_ci
          PUBLIC_ROLE_URL: postgresql://stage_tenant_a:synthetic-tenant-a@localhost:55481/cms_baseline_replay_ci
          EDITOR_ROLE_URL: postgresql://stage_tenant_b:synthetic-tenant-b@localhost:55481/cms_baseline_replay_ci
        run: npx tsx scripts/test-rls-payload-stage.mjs
      - name: Verify synthetic CMS backup, restore and content
        env:
          PGPASSWORD: synthetic-ci
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql -h localhost -U ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE stage_backup LOGIN PASSWORD 'synthetic-backup-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" -c 'GRANT pg_read_all_data TO stage_backup' -c 'CREATE DATABASE cms_restore_ci OWNER stage_owner'
          psql -h localhost -U ci -d cms_baseline_replay_ci -v ON_ERROR_STOP=1 -c "INSERT INTO posts(title,slug,status,content) VALUES ('Synthetic recovery published','synthetic-recovery-published','published','{\"test\":\"synthetic\"}'::jsonb),('Synthetic recovery draft','synthetic-recovery-draft','draft','{\"test\":\"synthetic draft\"}'::jsonb); INSERT INTO posts_tags (_order,_parent_id,id,tag) SELECT 1,id,'synthetic-recovery-tag','synthetic' FROM posts WHERE slug='synthetic-recovery-published';"
          docker exec "$POSTGRES_CONTAINER" pg_dump -U stage_backup -d cms_baseline_replay_ci --format=custom --no-owner --no-privileges -f /tmp/cms-recovery-synthetic.dump
          docker exec "$POSTGRES_CONTAINER" pg_restore -U stage_owner -d cms_restore_ci --exit-on-error --no-owner --no-privileges /tmp/cms-recovery-synthetic.dump
          query="SELECT row_to_json(t) FROM (SELECT p.slug,p.title,p.status,p.content,(SELECT json_agg(json_build_object('order',t._order,'id',t.id,'tag',t.tag) ORDER BY t._order) FROM posts_tags t WHERE t._parent_id=p.id) tags FROM posts p WHERE p.slug LIKE 'synthetic-recovery-%' ORDER BY p.slug) t"
          psql -h localhost -U ci -d cms_baseline_replay_ci -At -c "$query" > /tmp/cms-before-synthetic.jsonl
          psql -h localhost -U ci -d cms_restore_ci -At -c "$query" > /tmp/cms-after-synthetic.jsonl
          test "$(wc -l < /tmp/cms-before-synthetic.jsonl)" -eq 2
          diff -u /tmp/cms-before-synthetic.jsonl /tmp/cms-after-synthetic.jsonl
          psql -h localhost -U ci -d cms_restore_ci -v ON_ERROR_STOP=1 -c 'REVOKE CREATE ON SCHEMA public FROM PUBLIC' -c 'GRANT USAGE ON SCHEMA public TO stage_runtime' -c 'GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO stage_runtime' -c 'GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA public TO stage_runtime' -c 'REVOKE ALL ON TABLE payload_migrations FROM stage_runtime'
      - name: Exercise CMS against the restored synthetic database
        env:
          CMS_SECURITY_DB_TEST: isolated-ci
          PAYLOAD_SECRET: synthetic-ci-security-secret-at-least-32-characters
          DATABASE_URI: postgresql://stage_runtime:synthetic-runtime-only@localhost:55481/cms_restore_ci
        run: npm run test:security:integration
      - name: Check migration history after synthetic restore
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: synthetic-ci-security-secret-at-least-32-characters
          DATABASE_URI: postgresql://stage_runtime:synthetic-runtime-only@localhost:55481/cms_restore_ci
          MIGRATION_DATABASE_URL: postgresql://stage_owner:synthetic-owner-only@localhost:55481/cms_restore_ci
        run: node scripts/migrate-with-owner.mjs
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: node --test tests/deepmerge-vendor.test.mjs
      - run: npm audit --audit-level=low
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan tracked checkout without publishing secret values
        run: |
          mkdir /tmp/security-checkout
          git archive HEAD | tar -x -C /tmp/security-checkout
          /tmp/gitleaks dir /tmp/security-checkout --redact=100 --no-banner --report-format=json --report-path=/tmp/secrets.json >/tmp/secret-scan.log 2>&1 || result=$?
          node scripts/security-summary.mjs /tmp/secrets.json gitleaks
          exit "${result:-0}"
      - name: Scan history on scheduled or manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          /tmp/gitleaks git . --redact=100 --no-banner --report-format=json --report-path=/tmp/history.json >/tmp/history-scan.log 2>&1 || result=$?
          node scripts/security-summary.mjs /tmp/history.json gitleaks
          exit "${result:-0}"
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.178.0
      - name: Scan without sending source or telemetry
        run: |
          semgrep scan --config p/javascript --config p/typescript --metrics=off --disable-version-check --error --json --output /tmp/semgrep.json >/tmp/semgrep.log 2>&1 || result=$?
          node scripts/security-summary.mjs /tmp/semgrep.json semgrep
          exit "${result:-0}"
