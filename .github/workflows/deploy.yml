name: Deploy to VPS
on:
  workflow_run:
    workflows: ["Security checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Restricted preflight or verified CMS deployment
        type: choice
        options: [deploy, preflight]
        default: deploy
permissions:
  contents: read
  actions: read
concurrency:
  group: stor24-cms-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SHA }}
      - if: github.event.inputs.operation != 'preflight'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Require exact main security and validation evidence
        id: release
        if: github.event.inputs.operation != 'preflight'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/verify-release.mjs
      - name: Deploy through the restricted CMS identity
        timeout-minutes: 25
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha || github.sha }}
          VPS_USER: ${{ secrets.VPS_CMS_DEPLOY_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_CMS_DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ github.event.inputs.operation || 'deploy' }}
        run: |
          set -euo pipefail
          test "$VPS_USER" = stor24-cms-deploy
          [[ "$OPERATION" = deploy || "$OPERATION" = preflight ]]
          test -n "$VPS_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 .github/known_hosts "$HOME/.ssh/known_hosts"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/cms_deploy"
          chmod 600 "$HOME/.ssh/cms_deploy"
          trap 'rm -f "$HOME/.ssh/cms_deploy"' EXIT
          ssh-keygen -F srv938083.hstgr.cloud -f "$HOME/.ssh/known_hosts" > /dev/null
          python3 -c 'import json,os; op=os.environ["OPERATION"]; print(json.dumps({"operation":op,**({"sha":os.environ["RELEASE_SHA"],"github_token":os.environ["GH_TOKEN"]} if op=="deploy" else {})}))' | \
          ssh -4 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectionAttempts=3 -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/cms_deploy" "$VPS_USER@srv938083.hstgr.cloud" "$OPERATION"
